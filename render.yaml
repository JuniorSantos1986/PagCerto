services:
  - type: web
    name: pagcerto-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_FIRESTORE
        value: "1"
      - key: FIREBASE_PROJECT_ID
        value: pagcerto-a5ed4
      - key: CORS_ORIGINS
        value: https://pagcerto-a5ed4.web.app,https://pagcerto-a5ed4.firebaseapp.com
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
