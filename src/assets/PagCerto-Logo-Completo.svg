<svg id="full-logo-svg" viewBox="0 0 540 140" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto drop-shadow-xl">
                                <defs>
                                    <!-- Linear Gradients for Mark -->
                                    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#2563eb"/> <!-- Cobalt Blue -->
                                        <stop offset="60%" stop-color="#059669"/> <!-- Emerald Green -->
                                        <stop offset="100%" stop-color="#34d399"/> <!-- Mint Green -->
                                    </linearGradient>

                                    <linearGradient id="secondaryGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                                        <stop offset="0%" stop-color="#1d4ed8"/>
                                        <stop offset="100%" stop-color="#10b981"/>
                                    </linearGradient>

                                    <linearGradient id="checkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#6ee7b7"/>
                                        <stop offset="100%" stop-color="#3b82f6"/>
                                    </linearGradient>

                                    <!-- Subtle Inner Shadow / Ambient Effect -->
                                    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
                                        <feGaussianBlur stdDeviation="6" result="blur"/>
                                        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                                    </filter>
                                </defs>

                                <!-- ICON GROUP -->
                                <g id="logo-icon-part" transform="translate(10, 10)">
                                    <!-- Dynamic Shield/P-Letter Foundation Base -->
                                    <path d="M 20 25 C 20 18, 28 12, 40 12 L 75 12 C 95 12, 108 26, 108 46 C 108 66, 95 80, 75 80 L 48 80 L 48 108 C 48 114, 42 118, 34 118 L 34 118 C 26 118, 20 114, 20 108 Z" fill="url(#primaryGradient)"/>

                                    <!-- Inner Shield Contour / Financial Flow Layer -->
                                    <path d="M 48 32 L 72 32 C 82 32, 88 38, 88 46 C 88 54, 82 60, 72 60 L 48 60 Z" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round"/>

                                    <!-- Dynamic Checkmark & Calendar Accent (Seamlessly integrated) -->
                                    <path d="M 38 48 L 56 66 L 98 22" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

                                    <!-- Calendar/Notification Dot Accent -->
                                    <circle cx="96" cy="94" r="10" fill="#34d399"/>
                                    <circle cx="96" cy="94" r="4" fill="#ffffff"/>
                                </g>

                                <!-- TYPOGRAPHY GROUP -->
                                <g id="logo-text-part" transform="translate(145, 88)">
                                    <!-- "Pag" bold in white/dark dynamically adaptable or clean tech gradient -->
                                    <text font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="62" letter-spacing="-1.5">
                                        <tspan class="logo-text-primary" fill="#FFFFFF">Pag</tspan><tspan fill="url(#primaryGradient)">Certo</tspan>
                                    </text>

                                    <!-- Subtitle Slogan -->
                                    <text x="4" y="28" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" letter-spacing="3" fill="#9CA3AF" class="logo-subtext">
                                        CONTROLE FINANCEIRO
                                    </text>
                                </g>
                            </svg>